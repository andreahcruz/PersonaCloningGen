# ─────────────────────────────────────────────
#  Persona Cloning Pipeline — Docker Compose
#  Services: MinIO, Airflow, Spark, Streamlit
#  Credentials are read from .env (copy .env.example); `docker compose` refuses to start
#  without them. Published ports bind to 127.0.0.1 only — use an SSH tunnel to reach them
#  on a remote host. AWS: add `-f docker-compose.aws.yml`.
# ─────────────────────────────────────────────

# Rotate container logs so a long-running stack cannot fill the disk; read them with
# `docker compose logs <service>` (Streamlit, Airflow, Spark, Chroma, MinIO all use this).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW__CORE__FERNET_KEY in .env}
    # Same value on webserver + scheduler; otherwise log streaming returns 403 JWT InvalidSignatureError
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?set AIRFLOW__WEBSERVER__SECRET_KEY in .env}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    LOG_LEVEL: INFO
    # load_to_chroma and the Spark job refuse to run on chunk sets where more than this share
    # of rows has no embedding (Ollama down/overloaded during embedding).
    MAX_MISSING_EMBEDDING_FRACTION: "0.10"
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # MinIO connection info available to all DAGs
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    MINIO_BUCKET_RAW: lemkin-raw
    MINIO_BUCKET_PROCESSED: lemkin-processed
    # Input JSONL directory inside the container; /opt/airflow/data/cleaned = the cleaned corpus.
    LEMKIN_DATA_DIR: ${LEMKIN_DATA_DIR:-/opt/airflow/data}
    CHROMA_COLLECTION_NAME: lemkin_content
    PERSONA_LOCAL_PATH: ${PERSONA_LOCAL_PATH:-/opt/airflow/data/persona_profile.json}
    # Chroma vector store
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
    # Ollama: host machine by default; docker-compose.aws.yml deployments use http://ollama:11434
    OLLAMA_BASE: ${OLLAMA_BASE:-http://host.docker.internal:11434}
    # Spark embed: number of partitions *before* the Ollama UDF = max concurrent /api/embed streams per job.
    # 1 = slowest, quiet logs (one task); 4–8 = faster on a strong Ollama host; too high → timeouts / empty embeddings → lower it.
    SPARK_EMBED_PARTITIONS: ${SPARK_EMBED_PARTITIONS:-16}
    # SFT export chunk sizing (must match host_finetune defaults / fine-tune MAX_SEQ_LENGTH).
    MAX_SEQ_LENGTH: "512"
    SFT_CHUNK_OUTPUT_CHARS: "1600"
    DATASET_MAX_OUTPUT_CHARS: "2000"
    # SparkSubmitOperator: local[*] runs entirely in the Airflow container (pip PySpark).
    # spark://spark-master:7077 uses Bitnami workers; their Spark JARs differ from pip PySpark → InvalidClassException on org.apache.spark.scheduler.Task.
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"local[*]"}'
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags          # your DAG files
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── 1. PostgreSQL (Airflow metadata database) ──────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      # Applied only when postgres-data is first created; an existing local volume keeps "airflow".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    logging: *default-logging
    restart: always

  # ── 2. MinIO (local S3 replacement) ────────────────────────────────────────
  minio:
    # MinIO's maintained public container registry; Docker Hub's old mirror is archived.
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_HOST_API_PORT:-9000}:9000"   # S3 API; containers still use minio:9000
      - "127.0.0.1:${MINIO_HOST_CONSOLE_PORT:-9001}:9001"   # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    logging: *default-logging
    restart: always

  # ── 3. MinIO bucket setup (runs once on startup) ───────────────────────────
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb -p local/lemkin-raw;
      mc mb -p local/lemkin-processed;
      echo 'MinIO buckets created successfully';
      "
    logging: *default-logging
    restart: on-failure

  # ── 4. Airflow webserver ───────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"   # Airflow dashboard → visit http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    logging: *default-logging
    restart: always

  # ── 5. Airflow scheduler ───────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging
    restart: always

  # ── 6. Airflow init (creates admin user on first run) ─────────────────────
  # Runs once: DB migrate + admin user. Override entrypoint so `airflow` is on PATH (image entrypoint + bash -c breaks that).
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        # Use python -m airflow so we do not depend on the `airflow` shim (PATH / entrypoint quirks).
        python -m airflow db migrate
        python -m airflow users create --username "${AIRFLOW_ADMIN_USER:?set AIRFLOW_ADMIN_USER in .env}" --password "${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}" --firstname Admin --lastname User --role Admin --email admin@example.com || true
    logging: *default-logging
    restart: "no"

  # ── 7. Apache Spark ────────────────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "127.0.0.1:7077:7077"   # Spark master port
      - "127.0.0.1:8081:8080"   # Spark web UI → visit http://localhost:8081
    volumes:
      - ./spark_jobs:/opt/spark_jobs   # your PySpark scripts go here
      - ./data:/opt/data
    logging: *default-logging
    restart: always

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ./spark_jobs:/opt/spark_jobs
      - ./data:/opt/data
    logging: *default-logging
    restart: always

  # ── 8. Chroma (vector store) ───────────────────────────────────────────────
  chroma:
    # Pin to match pip `chromadb` in Airflow + Streamlit; `latest` vs old volume causes
    # "Could not connect to tenant default_tenant" (client/server/API or DB mismatch).
    image: chromadb/chroma:1.5.5
    container_name: chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Chroma 1.5 persists its SQLite/HNSW data under /data.
      - chroma-data:/data
    logging: *default-logging
    restart: always

  # ── 9. Streamlit app ───────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile          # we will create this next
    container_name: streamlit-app
    ports:
      - "127.0.0.1:8501:8501"   # Streamlit UI → visit http://localhost:8501
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      OLLAMA_BASE: ${OLLAMA_BASE:-http://host.docker.internal:11434}
      CHROMA_USE_HTTP: "true"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION_NAME: lemkin_content
      PYTHONUNBUFFERED: "1"   # show app logs in `docker compose logs streamlit` immediately
      LOG_LEVEL: INFO
    volumes:
      - ./user_interface.py:/app/user_interface.py
      - ./generate.py:/app/generate.py
      - ./spark_jobs:/app/spark_jobs
      - ./formats:/app/formats
      - ./data:/app/data
    depends_on:
      - minio
      - chroma
    logging: *default-logging
    restart: always

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  chroma-data:
