version: '3.8'

# ─────────────────────────────────────────────
#  Persona Cloning Pipeline — Docker Compose
#  Services: MinIO, Airflow, Spark, Streamlit
# ─────────────────────────────────────────────

# Rotate container logs so a long-running stack cannot fill the disk; read them with
# `docker compose logs <service>` (Streamlit, Airflow, Spark, Chroma, MinIO all use this).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    # Same value on webserver + scheduler; otherwise log streaming returns 403 JWT InvalidSignatureError
    AIRFLOW__WEBSERVER__SECRET_KEY: '298p-dev-airflow-webserver-secret-key-min-32chars'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    LOG_LEVEL: INFO
    # load_to_chroma and the Spark job refuse to run on chunk sets where more than this share
    # of rows has no embedding (Ollama down/overloaded during embedding).
    MAX_MISSING_EMBEDDING_FRACTION: "0.10"
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # MinIO connection info available to all DAGs
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET_RAW: lemkin-raw
    MINIO_BUCKET_PROCESSED: lemkin-processed
    LEMKIN_DATA_DIR: /opt/airflow/data
    CHROMA_COLLECTION_NAME: lemkin_content
    PERSONA_LOCAL_PATH: /opt/airflow/data/persona_profile.json
    # Chroma vector store
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
    # Ollama (runs on host machine)
    OLLAMA_BASE: http://host.docker.internal:11434
    # Spark embed: number of partitions *before* the Ollama UDF = max concurrent /api/embed streams per job.
    # 1 = slowest, quiet logs (one task); 4–8 = faster on a strong Ollama host; too high → timeouts / empty embeddings → lower it.
    SPARK_EMBED_PARTITIONS: "16"
    # SFT export chunk sizing (must match host_finetune defaults / fine-tune MAX_SEQ_LENGTH).
    MAX_SEQ_LENGTH: "512"
    SFT_CHUNK_OUTPUT_CHARS: "1600"
    DATASET_MAX_OUTPUT_CHARS: "2000"
    # SparkSubmitOperator: local[*] runs entirely in the Airflow container (pip PySpark).
    # spark://spark-master:7077 uses Bitnami workers; their Spark JARs differ from pip PySpark → InvalidClassException on org.apache.spark.scheduler.Task.
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"local[*]"}'
    # Shadow v2 reads canonical code and the local tokenizer snapshot. It does not download weights.
    LEMKIN_V2_CLEAN_EXECUTOR: spark
    LEMKIN_V2_CLEAN_SLICES: "4"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /opt/airflow
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
  volumes:
    - ./dags:/opt/airflow/dags          # your DAG files
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./host_finetune:/opt/airflow/host_finetune:ro
    - ./artifacts:/opt/airflow/artifacts
    - ./experiments:/opt/airflow/experiments:ro
    - ./.git:/opt/airflow/.git:ro
    - ${LEMKIN_HF_CACHE:-C:/Users/okevi/.cache/huggingface}:/home/airflow/.cache/huggingface:ro
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── 1. PostgreSQL (Airflow metadata database) ──────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    logging: *default-logging
    restart: always

  # ── 2. MinIO (local S3 replacement) ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API endpoint  → your code talks to this
      - "9001:9001"   # MinIO web console → visit http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    logging: *default-logging
    restart: always

  # ── 3. MinIO bucket setup (runs once on startup) ───────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/lemkin-raw;
      mc mb -p local/lemkin-processed;
      echo 'MinIO buckets created successfully';
      "
    logging: *default-logging
    restart: on-failure

  # ── 4. Airflow webserver ───────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"   # Airflow dashboard → visit http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    logging: *default-logging
    restart: always

  # ── 5. Airflow scheduler ───────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging
    restart: always

  # ── 6. Airflow init (creates admin user on first run) ─────────────────────
  # Runs once: DB migrate + admin user. Override entrypoint so `airflow` is on PATH (image entrypoint + bash -c breaks that).
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        # Use python -m airflow so we do not depend on the `airflow` shim (PATH / entrypoint quirks).
        python -m airflow db migrate
        python -m airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
    logging: *default-logging
    restart: "no"

  # ── 7. Apache Spark ────────────────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "7077:7077"   # Spark master port
      - "8081:8080"   # Spark web UI → visit http://localhost:8081
    volumes:
      - ./spark_jobs:/opt/spark_jobs   # your PySpark scripts go here
      - ./data:/opt/data
    logging: *default-logging
    restart: always

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ./spark_jobs:/opt/spark_jobs
      - ./data:/opt/data
    logging: *default-logging
    restart: always

  # ── 8. Chroma (vector store) ───────────────────────────────────────────────
  chroma:
    # Pin to match pip `chromadb` in Airflow + Streamlit; `latest` vs old volume causes
    # "Could not connect to tenant default_tenant" (client/server/API or DB mismatch).
    image: chromadb/chroma:1.5.5
    container_name: chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    logging: *default-logging
    restart: always

  # ── 9. Streamlit app ───────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile          # we will create this next
    container_name: streamlit-app
    ports:
      - "8501:8501"   # Streamlit UI → visit http://localhost:8501
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      OLLAMA_BASE: http://host.docker.internal:11434  # Ollama runs on your laptop
      CHROMA_USE_HTTP: "true"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION_NAME: lemkin_content
      PYTHONUNBUFFERED: "1"   # show app logs in `docker compose logs streamlit` immediately
      LOG_LEVEL: INFO
    volumes:
      - ./user_interface.py:/app/user_interface.py
      - ./generate.py:/app/generate.py
      - ./spark_jobs:/app/spark_jobs
      - ./formats:/app/formats
      - ./data:/app/data
    depends_on:
      - minio
      - chroma
    logging: *default-logging
    restart: always

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  chroma-data: