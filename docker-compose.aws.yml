# AWS (single EC2) override for the pipeline stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml exec ollama ollama pull nomic-embed-text
#
# - Ollama runs as a private container (no published port) serving nomic-embed-text only.
# - Airflow reads the cleaned corpus (data/cleaned/) and writes the persona copy under data/deploy/
#   so the tracked data/persona_profile.json is not overwritten. MinIO keeps the canonical copy.
# - Streamlit (profile "ui") and the unused Spark master/worker (profile "spark-cluster";
#   the DAG runs Spark as local[*] inside the scheduler) do not start unless their profile is enabled.
# - Set SPARK_EMBED_PARTITIONS=2..4 in .env for a CPU-only Ollama.

x-pipeline-env: &pipeline-env
  OLLAMA_BASE: http://ollama:11434
  LEMKIN_DATA_DIR: /opt/airflow/data/cleaned
  PERSONA_LOCAL_PATH: /opt/airflow/data/deploy/persona_profile.json
  SPARK_EMBED_PARTITIONS: ${SPARK_EMBED_PARTITIONS:-4}

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  airflow-scheduler:
    environment: *pipeline-env
    depends_on:
      ollama:
        condition: service_healthy

  airflow-webserver:
    environment: *pipeline-env

  streamlit:
    profiles: ["ui"]

  spark-master:
    profiles: ["spark-cluster"]

  spark-worker:
    profiles: ["spark-cluster"]

volumes:
  ollama-data:
