# AWS (single EC2) override for the pipeline stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml exec ollama ollama pull nomic-embed-text
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml exec ollama ollama pull llama3.1
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml exec ollama ollama create lemkin-qlora -f /models/Modelfile
#
# - Ollama runs as a private container for embeddings, base-Llama PersonaRAG, and QLoRA comparison generation.
# - Airflow reads the cleaned corpus (data/cleaned/) and writes the persona copy under data/deploy/
#   so the tracked data/persona_profile.json is not overwritten. MinIO keeps the canonical copy.
# - Streamlit (profile "ui") and the unused Spark master/worker (profile "spark-cluster";
#   the DAG runs Spark as local[*] inside the scheduler) do not start unless their profile is enabled.
# - Set SPARK_EMBED_PARTITIONS=2..4 in .env for a CPU-only Ollama.

x-pipeline-env: &pipeline-env
  OLLAMA_BASE: http://ollama:11434
  # Current S3-compatible endpoint used only by the EC2 demo.  It preserves the
  # pipeline's boto3/Spark S3 contract after the legacy MinIO images were retired.
  MINIO_ENDPOINT: http://minio:4566
  LEMKIN_DATA_DIR: /opt/airflow/data/cleaned
  PERSONA_LOCAL_PATH: /opt/airflow/data/deploy/persona_profile.json
  SPARK_EMBED_PARTITIONS: ${SPARK_EMBED_PARTITIONS:-4}

services:
  minio:
    # LocalStack provides the S3 API the pipeline uses; service name stays `minio`
    # so no DAG or Spark code needs a special EC2 path.
    # Pin the last free community image; current `latest` requires a LocalStack license token.
    image: localstack/localstack:3.8
    command: ""
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:${MINIO_HOST_API_PORT:-9000}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-setup:
    image: localstack/localstack:3.8
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-2
    entrypoint: >
      /bin/sh -c "
      awslocal --endpoint-url http://minio:4566 s3api create-bucket --bucket lemkin-raw || true;
      awslocal --endpoint-url http://minio:4566 s3api create-bucket --bucket lemkin-processed || true;
      echo 'S3-compatible buckets created successfully';
      "

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  airflow-scheduler:
    environment: *pipeline-env
    depends_on:
      ollama:
        condition: service_healthy

  airflow-webserver:
    environment: *pipeline-env

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OLLAMA_BASE: http://ollama:11434
      EMBED_MODEL: nomic-embed-text
      GEN_MODEL: llama3.1
      QLORA_MODEL: lemkin-qlora
      CHROMA_USE_HTTP: "true"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION_NAME: lemkin_content
      PERSONA_PATH: /app/data/deploy/persona_profile.json
      FORMAT_SPECS_PATH: /app/formats/format_specs.yaml
    volumes:
      - ./data:/app/data:ro
      - ./experiments:/app/experiments
    depends_on:
      ollama:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: live
        NEXT_PUBLIC_API_BASE: /api
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  streamlit:
    profiles: ["ui"]

  spark-master:
    profiles: ["spark-cluster"]

  spark-worker:
    profiles: ["spark-cluster"]

volumes:
  ollama-data:
